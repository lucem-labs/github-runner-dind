# Docker-in-Docker sidecars for the runner slots. Runner containers are not defined here:
# supervisor/runner-supervisor.ps1 starts a brand-new one per job for each slot, with a
# single-use JIT config, attached to slot N's sidecar:
#   --network container:<project>-dind-N-1   (shares its network namespace)
#   -v <project>_dind-N-certs:/certs:ro      (TLS client certificates)
# so containers a job starts with `docker run --publish 127.0.0.1::<port>` are reachable from
# the job on 127.0.0.1, and jobs only ever see their own dind daemon, never the host's Docker.
# Add a slot by copying dind-2 with the next number and its volumes.
name: ${RUNNERS_PROJECT:-github-runners}

x-dind: &dind
  # Pinned by digest (Dependabot keeps it current); keep in step with the image's Docker CLI.
  image: docker:29.9.1-dind@sha256:3e5756e2b6dad6a5f1f5deacf0a19f9eaa2581b76ae092b2d4a118162e1d4d4e
  # Required by Docker-in-Docker. See README.md "Isolation model" for what this does and doesn't protect.
  privileged: true
  restart: always
  environment:
    DOCKER_TLS_CERTDIR: /certs
  cpus: ${RUNNER_CPUS:-4}
  mem_limit: ${RUNNER_MEMORY:-6g}
  healthcheck:
    test: ["CMD", "docker", "info"]
    interval: 5s
    timeout: 5s
    retries: 30

services:
  dind-1:
    <<: *dind
    volumes:
      - dind-1-data:/var/lib/docker
      - dind-1-certs:/certs

  dind-2:
    <<: *dind
    volumes:
      - dind-2-data:/var/lib/docker
      - dind-2-certs:/certs

volumes:
  dind-1-data:
  dind-1-certs:
  dind-2-data:
  dind-2-certs:
