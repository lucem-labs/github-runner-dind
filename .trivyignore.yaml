# Time-boxed exceptions for vulnerabilities that have no fixed upstream release yet.
# Rules:
#   - every entry is scoped to the exact path where the vulnerable copy lives, so the same CVE
#     anywhere else still fails the scan;
#   - every entry has a statement explaining why it is acceptable for now, and an expiry date
#     after which the scan fails again;
#   - when an upstream release with the fix ships, bump it and delete the entry.
# The weekly rebuild and check-versions workflows surface new releases.

vulnerabilities:
  - id: CVE-2026-78661
    paths: ["usr/local/lib/docker/cli-plugins/docker-compose"]
    statement: "x/net/html denial of service via crafted HTML; Compose 5.7.1 vendors golang.org/x/net 0.60.0 and so does every release through 5.8.1 (latest), the fix is in 0.62.0; the plugin only talks to the local dind daemon."
    expired_at: 2026-12-08

  - id: CVE-2026-114149
    paths: ["home/runner/actions-runner/bin/Runner.Worker.deps.json"]
    statement: "ASP.NET Core multipart form parsing denial of service; runner 2.338.2 (latest release) bundles Microsoft.AspNetCore.WebUtilities 8.0.25, actions/runner#4849 moved it to 8.0.34 on main but no release has it yet; the worker serves no HTTP endpoint (its debugger bridge listens on loopback only)."
    expired_at: 2026-12-01
